<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — The Resident</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #051F20;
      color: #F0F7F4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(11, 43, 38, 0.85);
      border: 1px solid rgba(142, 182, 155, 0.25);
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .icon {
      width: 60px;
      height: 60px;
      background: rgba(142, 182, 155, 0.12);
      border: 1px solid rgba(142, 182, 155, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 26px;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #8EB69B;
      color: #051F20;
      border: none;
      border-radius: 16px;
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8EB69B;
      background: rgba(142, 182, 155, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(142, 182, 155, 0.2);
      margin-bottom: 16px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8EB69B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">
      <span class="dot"></span> Offline Shell Active
    </div>
    <div class="icon">📶</div>
    <h1>No Connection Detected</h1>
    <p>You are currently offline. Any offline actions or messages will automatically sync when connection returns.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
