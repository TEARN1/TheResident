# Watches the app from OUTSIDE Supabase, every 3 hours.
#
# Every check inside the database runs on pg_cron. If pg_cron stops or the
# free-tier project pauses, they all go quiet together — and quiet looks
# exactly like healthy. This is the dead-man's switch: it opens one issue when
# something is wrong, comments while it stays wrong, and closes it on recovery.
#
# Needs repository secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and
# SITE_URL. Without them it fails loudly, which is the point.
name: ops-watchdog

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Nightly run and critical findings
        id: db
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/ops-report.mjs heartbeat | tee report.txt

      - name: The live site answers
        id: site
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e
          base="${SITE_URL:-https://theresidentcrew.com}"
          for path in / /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "- $base$path answered HTTP $code" >> report.txt
              exit 1
            fi
          done

      - name: Open, update or close the watchdog issue
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.db.outcome == 'failure' || steps.site.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs')
            const report = fs.existsSync('report.txt') ? fs.readFileSync('report.txt', 'utf8') : ''
            const failed = process.env.FAILED === 'true'
            const label = 'ops-watchdog'
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1 })
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (failed && !open.length) {
              await github.rest.issues.create({ ...context.repo, labels: [label],
                title: 'Ops watchdog: something stopped',
                body: `${report}\n\n[Run](${run}). This issue closes itself when the checks pass again.` })
            } else if (failed) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number,
                body: `Still failing:\n\n${report}\n\n[Run](${run})` })
            } else if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number,
                body: `Recovered. [Run](${run})` })
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, state: 'closed' })
            }
            if (failed) core.setFailed('watchdog found a problem')
