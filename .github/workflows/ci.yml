name: The Resident - Automated CI/CD Quality Pipeline

on:
  push:
    # claude/** included because that is where work actually lands — without
    # it, every commit made on those branches got no CI signal at all.
    branches: [ main, 'claude/**', map/vibemap-perf-a11y ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: TypeCheck, Unit Tests, Fuzzing & Scale Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: "Layer 2: TypeScript Type Check"
        run: npx tsc --noEmit

      - name: "Layer 2: Unit Test Suite"
        run: npm test

      - name: "Layer 2: Production Build"
        run: npm run build

      # The only step here that renders anything. tsc, npm test and the build
      # above all pass on a route that throws on render, or middleware that
      # returns 429 to a normal person — which is exactly what happened: the
      # throttle counted Next's own prefetches against the user, so four page
      # views a minute earned a JSON error blob, and every check in this file
      # stayed green while it did.
      - name: "Layer 14: Browser Smoke Test"
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: "Layer 13: Security Fuzzer"
        run: npm run fuzzer

      - name: "Layer 2: High-Concurrency Scale Benchmark"
        run: npm run scale-test

  database:
    name: Schema Assertions & Restore Drill
    runs-on: ubuntu-latest

    # Deliberately a separate job. It needs a PostgreSQL with PostGIS and
    # nothing from Node, and keeping it independent means a broken schema
    # reports as a broken schema rather than hiding inside the Node job.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL 16 and PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3

      # WHY THIS EXISTS.
      #
      # sql-tests/ is where every authorisation finding from the security
      # review is locked in: the res_moderate privilege escalation, the
      # res_household_members IDOR, the trust-pair cross-user writes, the
      # fail-open-on-NULL scanner, the grant/policy audit, the RLS sweep.
      # Each one is written as the actual exploit, so a future rewrite that
      # reintroduces the hole fails here however it is written.
      #
      # None of it ran in CI. The whole suite was enforced only by someone
      # remembering to run it by hand — which is not enforcement, it is a
      # habit, and habits do not survive a busy week. A regression in any of
      # those functions would have reached production with every check on
      # this pipeline green.
      - name: "Layer 15: SQL Test Suite"
        run: ./sql-tests/run.sh

      # An untested backup is a hypothesis, not a backup. This proves the
      # schema of record still rebuilds the database from nothing, and is
      # still safe to apply twice — the thing you need to be true on the one
      # day you are relying on it, which is the worst possible day to
      # discover it is not. It found a 12-table RLS hole the first time it
      # ran. It touches nothing outside its own throwaway PostgreSQL.
      - name: "Layer 15: Tier 3 Restore Drill"
        run: ./scripts/restore-drill.sh
