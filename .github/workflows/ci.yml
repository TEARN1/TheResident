name: The Resident - Automated CI/CD Quality Pipeline

on:
  push:
    branches: [ main, map/vibemap-perf-a11y ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: TypeCheck, Unit Tests, Fuzzing & Scale Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Layer 2: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Layer 2: Unit Test Suite
        run: npm test

      - name: Layer 13: Security Fuzzer
        run: npm run fuzzer

      - name: Layer 2: High-Concurrency Scale Benchmark
        run: npm run scale-test
