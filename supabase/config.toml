# Supabase CLI config for The Resident.
#
# The project is SHARED with The Gruvs (see CONTRACT.md) — one Supabase
# project, two apps. That has a consequence worth stating at the top of this
# file: `supabase db reset` and `db diff` operate on the whole database, not
# just the res_* tables. Never reset the linked project.

project_id = "feevvddvrjmfbhffccbf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match production: the live project runs Postgres 17.6.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ── Edge functions ──────────────────────────────────────────────────────────
# res-scheduler runs as service_role and bypasses RLS entirely, so it must
# never be publicly callable. verify_jwt = false is correct here BUT ONLY
# because the function authenticates every request against SCHEDULER_SECRET
# itself and refuses to serve at all when that variable is unset — pg_cron
# calls it with a bearer secret, not a user JWT.
[functions.res-scheduler]
verify_jwt = false

[analytics]
enabled = false
